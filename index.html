<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Gerenciador de Tarefas</h1>

    <section class="card">
      <h2>Cadastro de tarefa</h2>
      <form id="tarefa-add-form">
        <div class="form-add">
          <div id="form-error" class="error"></div>
          <label for="titulo">
            Título
            <input id="titulo" name="titulo" type="text" placeholder="Ex.: Estudar JavaScript" required>
          </label>

          <label for="descricao">
            Descrição
            <textarea id="descricao" name="descricao" placeholder="Ex.: Estudar os conceitos de funções, objetos e arrays" rows="8" required></textarea>
          </label>

          <label for="categoria">
            Categoria
            <select id="categoria" name="categoria" required>
              <option value="0">Selecione</option>
              <option value="1">Estudos</option>
              <option value="2">Trabalho</option>
              <option value="3">Pessoal</option>
              <option value="4">Casa</option>
              <option value="5">Outros</option>
            </select>
          </label>

          <label for="prioridade">
            Prioridade
            <select id="prioridade" name="prioridade" required>
              <option value="0">Selecione</option>
              <option value="1">Baixa</option>
              <option value="2">Média</option>
              <option value="3">Alta</option>
            </select>
          </label>

          <label for="data">
            Data de conclusão
            <input id="data" name="data" type="date" required>
          </label>
        </div>
        <button type="button" id="cadatrar">Cadastrar tarefa</button>
      </form>
    </section>

    <section class="card">
      <h2>Filtros</h2>
      <div class="filters">
        <label>
          Situação
          <select id="filtro-status">
            <option value="todas">Todas</option>
            <option value="pendentes">Pendentes</option>
            <option value="concluidas">Concluídas</option>
          </select>
        </label>

        <label>
          Categoria
          <select id="filtro-categoria">
            <option value="todas">Todas</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Resumo</h2>
      <ul class="stats">
        <li>Total de tarefas: <strong id="total-tarefas">0</strong></li>
        <li>Tarefas pendentes: <strong id="pendentes-tarefas">0</strong></li>
        <li>Tarefas concluídas: <strong id="concluidas-tarefas">0</strong></li>
      </ul>
    </section>

    <section class="card">
      <h2>Tarefas</h2>
      <div id="lista-tarefas" class="task-list" aria-live="polite" role="list"></div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
